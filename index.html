<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">YOUR DAY, ORGANIZED</p>
      <h1>My To-Do List</h1>
      <p class="subtitle">One small step at a time.</p>
    </header>

    <form id="todo-form" class="todo-form">
      <input id="todo-input" type="text" placeholder="What do you need to do?" maxlength="120" autocomplete="off" aria-label="New task">
      <button type="submit">Add task</button>
    </form>

    <div class="toolbar">
      <span id="task-count">0 tasks left</span>
      <button id="clear-completed" class="text-button" type="button">Clear completed</button>
    </div>

    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
    <p id="empty-state" class="empty-state">Nothing here yet. Add your first task above!</p>
    <footer>Tasks are saved in this browser on this device.</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
